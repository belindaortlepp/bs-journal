<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B's Journal - Belinda Ortlepp</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="assets/logo-small.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#754289">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="B's Journal">
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>
<div id="stage">
  <canvas id="c" width="480" height="270"></canvas>
  <canvas id="tc"></canvas>
  <div id="ui">
    <div id="dlg" class="box hidden"><img id="dicon" src="assets/dialogue-icon.png" alt=""><div id="dport" class="b"></div><div id="dname"></div><div id="dtext"></div><div id="dnext"></div></div>
    <div id="card" class="box hidden"></div>
    <div id="journal" class="hidden">
      <img id="jimg" src="assets/journal-new.png" alt="">
      <div id="jtabs"></div>
      <div id="pgL" class="pg"></div><div id="pgR" class="pg"></div>
      <div id="flip"></div>
      <button class="jarrow" id="jprev" style="left:68px">&lt;</button><button class="jarrow" id="jnext" style="left:396px">&gt;</button>
      <button class="jclose" id="jclose">X</button>
      <div id="jfoot"></div>
    </div>
    <div id="map" class="hidden"><img id="mapimg" src="assets/map.png" alt=""><div id="maphot"></div><button class="jclose" id="mapclose">X</button><div id="maphint">Click a place to travel there. Esc closes the map.</div></div>
    <div id="menu" class="box hidden"></div>
    <div id="help" class="box hidden"></div>
    <div id="toast" class="hidden"></div>
  </div>
</div>
<div id="tpad"><button class="tb" id="tpL" aria-label="Walk left">&lt;</button><button class="tb" id="tpR" aria-label="Walk right">&gt;</button><button class="tb" id="tpE" aria-label="Action">E</button><button class="tb tm" id="tpM">MENU</button></div>

<div id="rot"><div class="ph"></div>Please turn your phone sideways to play.</div>
<div id="pn"><div class="who"><img src="assets/cat-notice.png" alt="">Peanut</div><div>Mrrp. Hi! This website works best on a laptop or desktop with a keyboard. You can still explore on this device with the on-screen buttons. Have fun!</div><div id="pnfs"></div><button id="pnok">OK</button></div>
<script src="main.js?v=8"></script>
</body>
</html>
